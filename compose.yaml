services:
  mongodb:
    image: mongo:7
    container_name: 02-rag-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-rag_db}
      MONGO_DATABASE: ${MONGO_DATABASE:-rag_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Missing app username}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Missing app password}
    volumes:
      - 02_rag_mongodb_data:/data/db
      - ./docker/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/01-init-mongo.sh:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_INITDB_ROOT_USERNAME}
        - --password
        - ${MONGO_INITDB_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: 02-rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - 02_rag_qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: 02-rag-redis-celery
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - 02_rag_celery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  02_rag_mongodb_data:
    name: 02_rag_mongodb_data
  02_rag_qdrant_data:
    name: 02_rag_qdrant_data


  02_rag_celery_redis_data:
    name: 02_rag_celery_redis_data
